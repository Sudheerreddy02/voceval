[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voceval"
version = "0.1.0"
description = "A provider-agnostic real-time voice agent runtime plus a simulation-based evaluation framework."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sudheer Reddy Kuluru" }]
keywords = ["voice-ai", "voice-agent", "llm", "evaluation", "simulation", "stt", "tts", "latency"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
deepgram = ["deepgram-sdk>=7.0"]
cartesia = ["cartesia>=4.0"]
elevenlabs = ["elevenlabs>=2.0"]
telephony = ["websockets>=13.0"]
audio = ["numpy>=1.24", "sounddevice>=0.4.6"]
all = [
    "openai>=1.40",
    "deepgram-sdk>=7.0",
    "cartesia>=4.0",
    "elevenlabs>=2.0",
    "websockets>=13.0",
    "numpy>=1.24",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "websockets>=13.0",
]

[project.urls]
Homepage = "https://github.com/Sudheerreddy02/voceval"
Repository = "https://github.com/Sudheerreddy02/voceval"
Issues = "https://github.com/Sudheerreddy02/voceval/issues"

[project.scripts]
voceval = "voceval.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/voceval"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008"]  # typer uses function calls in argument defaults

[tool.mypy]
python_version = "3.10"
packages = ["voceval"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
